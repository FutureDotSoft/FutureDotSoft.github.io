<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mind Duel</title>
<meta name="description" content="Mind Duel: rövid, időre menő fejtörők, párbajban barátokkal, kollégákkal, párokkal.">
<style>
  :root { --bg:#f4f2ee; --card:#fff; --fg:#1c1b1f; --muted:#5f5d66; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121214; --card:#1c1c1f; --fg:#ecebf0; --muted:#a9a7b0; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding:16px; }
  main { max-width:420px; background:var(--card); border-radius:20px; padding:28px 24px; text-align:center; }
  h1 { margin:8px 0 4px; } p { color:var(--muted); margin:0; }
</style>
</head>
<body>
<main>
  <div style="font-size:48px">🧩</div>
  <h1>Mind Duel</h1>
  <p id="t">Rövid, időre menő fejtörők – egyedül vagy párbajban. Hamarosan.</p>
</main>
<script>
  if (!navigator.language.startsWith('hu')) {
    document.documentElement.lang = 'en';
    document.getElementById('t').textContent = 'Quick, timed puzzles – solo or in a duel. Coming soon.';
  }
</script>
</body>
</html>
