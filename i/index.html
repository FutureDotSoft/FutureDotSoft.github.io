<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mind Duel – meghívó</title>
<meta name="description" content="Kihívtak a Mind Duelben: 3 gyors játék, ugyanazok a pályák mindkettőtöknek.">
<style>
  :root { --bg:#f4f2ee; --card:#fff; --fg:#1c1b1f; --muted:#5f5d66; --accent:#5b5bd6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121214; --card:#1c1c1f; --fg:#ecebf0; --muted:#a9a7b0; --accent:#a5a6ff; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding:16px; }
  main { width:100%; max-width:420px; background:var(--card); border-radius:20px; padding:28px 24px; text-align:center; }
  h1 { font-size:26px; margin:8px 0 4px; }
  p { color:var(--muted); margin:0 0 20px; }
  .code { font-size:22px; letter-spacing:4px; font-weight:700; margin:0 0 20px; }
  a.btn { display:block; padding:14px; border-radius:999px; text-decoration:none; font-weight:600; margin-top:12px; }
  a.primary { background:var(--accent); color:#fff; }
  a.secondary { border:1.5px solid var(--muted); color:var(--fg); }
  .hint { font-size:13px; margin-top:20px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <div style="font-size:48px">⚔️</div>
  <h1 data-t="title">Kihívtak!</h1>
  <p data-t="body">3 gyors játék, mindkettőtöknek ugyanazok a pályák.</p>
  <div class="code" id="code"></div>
  <a class="btn primary" id="open" data-t="open">Megnyitás az appban</a>
  <a class="btn secondary" id="ios" hidden data-t="ios">Letöltés – App Store</a>
  <a class="btn secondary" id="android" hidden data-t="android">Letöltés – Google Play</a>
  <p class="hint" data-t="hint">Letöltés után koppints újra a kapott linkre, és a kihívás megnyílik.</p>
</main>
<script>
  // Letöltési linkek: kiadás előtt TestFlight; amíg üres, a gomb rejtve marad.
  const IOS_URL = '';
  const ANDROID_URL = '';

  const en = {
    title: 'You have been challenged!',
    body: '3 quick games – the same puzzles for both of you.',
    open: 'Open in the app',
    ios: 'Download – App Store',
    android: 'Download – Google Play',
    hint: 'After installing, tap the link you received again and the challenge opens.',
  };
  if (!navigator.language.startsWith('hu')) {
    document.documentElement.lang = 'en';
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = en[el.dataset.t]; });
  }
  const code = (new URLSearchParams(location.search).get('c') || '').toUpperCase();
  const valid = /^[A-Z0-9]{6}$/.test(code);
  document.getElementById('code').textContent = valid ? code : '';
  document.getElementById('open').href = valid ? 'minduel://i?c=' + code : '#';
  const ua = navigator.userAgent;
  if (IOS_URL && !/Android/i.test(ua)) { const a = document.getElementById('ios'); a.href = IOS_URL; a.hidden = false; }
  if (ANDROID_URL && !/iPhone|iPad/i.test(ua)) { const a = document.getElementById('android'); a.href = ANDROID_URL; a.hidden = false; }
</script>
</body>
</html>
